name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run unit tests
        run: make test

  stm32-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the ARM cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build the STM32C031C6 firmware
        run: make stm32
      - name: Keep the firmware files
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/stm32/firmware.elf
            build/stm32/firmware.bin
